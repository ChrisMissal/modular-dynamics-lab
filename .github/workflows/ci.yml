name: Reproducibility checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[verify]'
      - name: Unit and property tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce artifacts
        run: python -m modular_dynamics_lab run --config experiments/baseline.json --output out/baseline
      - name: Validate generated checksums
        run: python -m modular_dynamics_lab verify --output out/baseline
      - name: Match reviewed baseline
        run: diff -r data/baseline out/baseline
      - name: Independently check orders with SymPy
        run: python scripts/check_sympy.py

  feature_space:
    name: Study 002 — feature-space vectors & SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Generate exact feature vectors and SVGs
        run: python -m modular_dynamics_lab feature-space --config experiments/feature_space_v1.json --output out/feature_space
      - name: Verify generated artifacts
        run: python -m modular_dynamics_lab verify --output out/feature_space
      - name: Record GitHub source provenance outside deterministic math artifacts
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          printf "source_commit=%s\n" "$SOURCE_COMMIT" > out/feature_space/ci_provenance.txt
          printf "checkout_commit=%s\n" "$(git rev-parse HEAD)" >> out/feature_space/ci_provenance.txt
          printf "workflow_run_id=%s\n" "$GITHUB_RUN_ID" >> out/feature_space/ci_provenance.txt
      - name: Upload research figures and data
        uses: actions/upload-artifact@v4
        with:
          name: modular-dynamics-feature-space-v1
          path: out/feature_space/
          if-no-files-found: error
          retention-days: 30
      - name: Explain figures in workflow summary
        shell: bash
        run: |
          echo "## Study 002 — Prime feature vectors & harmonic intersections" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **modular-dynamics-feature-space-v1** in Artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "- feature_map.svg — exact order fractions for bases 2 and 3" >> "$GITHUB_STEP_SUMMARY"
          echo "- harmonic_intersections.svg — modular zero-return intersections near 1093 and 3511" >> "$GITHUB_STEP_SUMMARY"
          echo "- JSONL feature vectors, harmonic statistics, summary, and checksum manifest included." >> "$GITHUB_STEP_SUMMARY"
