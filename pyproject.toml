[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-dynamics-lab"
version = "0.1.0"
description = "Reproducible experiments in modular cycle lifting and Wieferich primes"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
verify = ["sympy==1.14.0"]

[project.scripts]
mdl = "modular_dynamics_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
